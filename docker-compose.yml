services:
  ros-dev:
    container_name: ${PROJECT_NAME}-ros
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.ros
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ros-baseimage-01b
    runtime: nvidia
    environment:
      - DISPLAY=$CONTAINER_DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/rosuser/.Xauthority
    volumes:
      - ./:/home/rosuser/repo
      - ${DATASET}:/home/rosuser/repo/dataset:rw
      # Mount the cloned repositories
      - ${DL_UTILS_PATH:-./external_repos/DL_utils}:/home/rosuser/repo/src/DL_utils/:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/home/rosuser/.Xauthority:rw
      - /dev:/dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    ports:
      - "${DEBUG_PORT:-5678}:5678"
    networks:
      app-network:
        aliases:
          - ros-container
    tty: true
    stdin_open: true
    command: bash -c "source /opt/ros/noetic/setup.bash && exec bash"
 
networks:
  app-network:
    name: ${PROJECT_NAME}-app-network
    driver: bridge
    attachable: true